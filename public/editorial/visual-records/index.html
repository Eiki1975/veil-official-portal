<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEILのビジュアル記録について｜AI支援イラストと物語</title><meta name="description" content="VEILのビジュアルは、各話の感情と場面を補助するAI支援イラストです。物語と静止画で構成する架空バンドのビジュアル記録について説明します。"><link rel="canonical" href="https://veil-archive.com/editorial/visual-records/"><style>body{max-width:760px;margin:0 auto;padding:48px 20px;background:#101012;color:#eee;font:16px/1.9 system-ui,sans-serif}a{color:#f4c778}small{color:#aaa}h1{line-height:1.25}h2{margin-top:2.5em}</style></head><body><small>VEIL EDITORIAL / VISUAL RECORDS</small><h1>ビジュアル記録について</h1><p>VEILでは、物語の余韻を補助する静止画のビジュアル記録を公開しています。各話の衣装、部屋、ライブ後の空気、人物の視線を、文章と並べて記録するためのAI支援イラストです。</p><h2>想像の余白</h2><p>このページが扱うのは、人物の魅力、衣装、場面、雰囲気です。映像作品を提供するのではなく、物語を読むための静止画の記録として制作しています。</p><h2>提供していないもの</h2><p>現在公開しているのはイラストと物語です。イメージビデオ、DVD、動画作品の販売・配信は行っていません。</p><p><a href="/editorial/reading-guide/">読者案内へ戻る</a></p></body></html>
